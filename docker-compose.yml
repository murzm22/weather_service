services:
  mongo:
    image: mongo:6
    container_name: weather_service_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: weather_service
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  web:
    build: .
    container_name: weather_service_web
    expose:
      - "8000"
    environment:
      MONGO_URL: "mongodb://root:example@mongo:27017/weather_service?authSource=admin"

  nginx:
    image: nginx:latest
    container_name: weather_service_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - web

volumes:
  mongo_data:
